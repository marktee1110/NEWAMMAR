<!doctype html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>📂 P4 مدير الجلسات — م. عمار يوسف</title>

  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => console.log('PWA Ready ✅'));
      });
    }
  </script>

  <style>
    :root{--main:#f59e0b;--danger:#ef4444;--p1:#0ea5e9;--p2:#6366f1;--bg:#ffffff}
    body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:#000;direction:ltr; text-align: left;}
    nav{background:#1e293b; padding:12px; text-align:center; display:flex; justify-content:center; gap:10px; flex-wrap:wrap;}
    nav a{color:#fff; text-decoration:none; font-size:14px; font-weight:bold; background:rgba(255,255,255,0.1); padding:8px 12px; border-radius:5px;}
    header{background:var(--main);color:#fff;padding:15px;text-align:center;}
    header h1{margin:0;font-size:24px;font-weight:900}
    .container{max-width:980px;margin:10px auto;padding:0 8px}
    .card{background:#fff;padding:15px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);margin-bottom:12px;border:2px solid #000}
    table{width:100%; border-collapse:collapse; margin-top:10px;}
    th,td{border:3px solid #000; padding:12px 4px; text-align:center; font-size:18px; font-weight:900;}
    th{background:#eee; font-size:12px;}
    .btn{padding:8px; border:none; border-radius:8px; cursor:pointer; font-weight:900;}
    .badge{padding:4px 8px; border-radius:6px; font-size:12px; color:#fff; font-weight:bold;}
    .badge.p1{background:var(--p1)} .badge.p2{background:var(--p2)}
    .modal { display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.9); overflow-y:auto; }
    .modal-content { background:#fff; margin:2% auto; padding:15px; width:94%; border-radius:10px; border:2px solid #000; }
    pre { background:#fff; color:#000; padding:15px; border:2px solid #000; font-family:monospace; font-size:18px; font-weight:900; white-space:pre-wrap; text-align:left; direction:ltr; }
  </style>
</head>
<body>
<nav>
    <a href="p1_survey.html">📐 الرفع</a>
    <a href="p2_stakeout.html">🎯 التوقيع</a>
    <a href="p3_db_manager.html">🗄️ النقاط</a>
</nav>
<header><h1>📂 أرشيف الجلسات المساحية</h1><p>م. عمار يوسف</p></header>
<div class="container">
  <div class="card" style="overflow-x:auto;">
    <table>
      <thead><tr><th>النوع</th><th>الجلسة</th><th>التاريخ</th><th>⚙️</th></tr></thead>
      <tbody id="sessionsBody"></tbody>
    </table>
  </div>
</div>

<div id="viewModal" class="modal">
    <div class="modal-content">
        <h2 style="text-align:center">🔍 تقرير الجلسة المؤرشفة</h2>
        <pre id="summaryText"></pre>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn" style="flex:2; background:#000; color:#fff; font-size:18px;" id="exportBtn">💾 تصدير .txt</button>
            <button class="btn" style="flex:1; background:#ddd;" onclick="document.getElementById('viewModal').style.display='none'">إغلاق</button>
        </div>
    </div>
</div>

<script>
    function init() {
        const p1 = JSON.parse(localStorage.getItem("sessionsDB_P1") || "[]").map(s => ({...s, db:'sessionsDB_P1', type:'رفع', cls:'p1'}));
        const p2 = JSON.parse(localStorage.getItem("sessionsDB_P2") || "[]").map(s => ({...s, db:'sessionsDB_P2', type:'توقيع', cls:'p2'}));
        const all = [...p1, ...p2].sort((a,b) => b.id - a.id);
        document.getElementById("sessionsBody").innerHTML = all.map(s => `<tr>
            <td><span class="badge ${s.cls}">${s.type}</span></td>
            <td><b>${s.name}</b></td>
            <td><small>${s.date}</small></td>
            <td>
                <button class="btn" style="background:#10b981; color:#fff" onclick="openS('${s.db}', ${s.id})">👁️</button>
                <button class="btn" style="background:#ef4444; color:#fff" onclick="delS('${s.db}', ${s.id})">🗑</button>
            </td>
        </tr>`).join("");
    }

    function openS(dbN, id) {
        const s = JSON.parse(localStorage.getItem(dbN)).find(x => x.id === id);
        let txt = `========================================\n`;
        txt += `التقرير المؤرشف: ${s.name}\n`;
        txt += `التاريخ: ${s.date}\n`;
        txt += `الوقفة: ${s.st.n} (X:${s.st.x}, Y:${s.st.y})\n`;
        txt += `الزيرو: ${s.bs.n} (X:${s.bs.x}, Y:${s.bs.y})\n`;
        txt += `========================================\n\n`;
        s.data.forEach((d, i) => {
            txt += `P${i+1}: xc=${Number(d.x).toFixed(2)}, yc=${Number(d.y).toFixed(2)}\n`;
            txt += `HD=${d.hd || d.d}, HR=${d.hr || d.r}\n`;
            txt += `--------------------\n`;
        });
        document.getElementById("summaryText").innerText = txt;
        document.getElementById("exportBtn").onclick = () => {
            const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Archive_${s.name}.txt`;
            link.click();
        };
        document.getElementById("viewModal").style.display = "block";
    }

    function delS(dbN, id) { if(confirm("حذف نهائي؟")) { let db = JSON.parse(localStorage.getItem(dbN)).filter(x => x.id !== id); localStorage.setItem(dbN, JSON.stringify(db)); init(); } }
    window.onload = init;
</script>
</body>
</html>
