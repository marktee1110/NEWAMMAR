<!doctype html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>نظام عمار يوسف المساحي - الواجهة الرئيسية</title>

  <!-- إعدادات PWA -->
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('PWA Ready ✅'))
          .catch(err => console.log('PWA Error ❌', err));
      });
    }
  </script>

  <style>
    :root {
      --primary: #0ea5e9; --secondary: #6366f1; --success: #10b981;
      --warning: #f59e0b; --danger: #ef4444; --dark: #1e293b;
    }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc; color: var(--dark); direction: rtl;
    }
    header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white; padding: 30px 15px; text-align: center;
      border-radius: 0 0 30px 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    header h1 { margin: 0; font-size: 28px; font-weight: 900; }
    header p { margin: 5px 0 0; opacity: 0.9; font-weight: bold; }

    .container { padding: 20px 15px; max-width: 600px; margin: 0 auto; }
    
    /* شبكة الأزرار */
    .menu-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px;
    }
    .menu-card {
      background: white; border: 2px solid #e2e8f0; border-radius: 20px;
      padding: 20px; text-align: center; text-decoration: none; color: var(--dark);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: transform 0.2s, border-color 0.2s;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .menu-card:active { transform: scale(0.95); border-color: var(--primary); }
    .menu-card i { font-size: 40px; margin-bottom: 10px; }
    .menu-card span { font-size: 18px; font-weight: 900; }
    
    /* قسم الحالة */
    .status-bar {
      background: #fff; padding: 15px; border-radius: 15px; border: 2px solid #000;
      margin-bottom: 20px; display: flex; justify-content: space-around; text-align: center;
    }
    .status-item { display: flex; flex-direction: column; }
    .status-label { font-size: 12px; color: #64748b; font-weight: bold; }
    .status-value { font-size: 18px; font-weight: 900; color: var(--primary); }

    .footer { text-align: center; margin-top: 30px; color: #94a3b8; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>

<header>
  <h1>نظام المهندس عمار يوسف</h1>
  <p>الحسابات المساحية المتكاملة</p>
</header>

<div class="container">
  <!-- شريط الحالة السريع -->
  <div class="status-bar">
    <div class="status-item">
      <span class="status-label">النقاط المخزنة</span>
      <span id="ptsCount" class="status-value">0</span>
    </div>
    <div class="status-item">
      <span class="status-label">حالة النظام</span>
      <span class="status-value" style="color:var(--success)">متصل (Local)</span>
    </div>
  </div>

  <!-- لوحة التحكم الرئيسية -->
  <div class="menu-grid">
    <a href="p1_survey.html" class="menu-card" style="border-bottom: 5px solid var(--primary);">
      <i>📐</i>
      <span>الرفع الميداني</span>
    </a>
    
    <a href="p2_stakeout.html" class="menu-card" style="border-bottom: 5px solid var(--secondary);">
      <i>🎯</i>
      <span>التوقيع المساحي</span>
    </a>
    
    <a href="p5_check.html" class="menu-card" style="border-bottom: 5px solid #a855f7;">
      <i>🔍</i>
      <span>برنامج التحقيق</span>
    </a>

    <a href="p3_db_manager.html" class="menu-card" style="border-bottom: 5px solid var(--success);">
      <i>🗄️</i>
      <span>مدير البيانات</span>
    </a>
    
    <a href="p4_session_manager.html" class="menu-card" style="grid-column: span 2; border-bottom: 5px solid var(--warning);">
      <i>📂</i>
      <span>أرشيف الجلسات والتقارير</span>
    </a>
  </div>

  <div class="footer">
    إصدار 2026.05 | يعمل بالكامل بدون إنترنت
  </div>
</div>

<script>
  // جلب عدد النقاط من localStorage لتحديث الواجهة
  window.onload = () => {
    const db = JSON.parse(localStorage.getItem("pointsDB") || "[]");
    document.getElementById("ptsCount").innerText = db.length;
  };
</script>

</body>
</html>
