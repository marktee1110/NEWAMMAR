<!doctype html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>🎯 P2 التوقيع الميداني المتكامل — م. عمار يوسف</title>

  <!-- إضافات الـ PWA للتعرف على التطبيق وتثبيته -->
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('PWA Ready ✅'))
          .catch(err => console.log('PWA Error ❌', err));
      });
    }
  </script>

  <style>
    :root{--main:#6366f1;--danger:#f43f5e;--ok:#10b981;--bg:#ffffff}
    body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:#000;direction:ltr; text-align: left; overflow-x: hidden;}
    nav{background:#1e293b; padding:10px; text-align:center; display:flex; justify-content:center; gap:8px; flex-wrap:wrap;}
    nav a{color:#fff; text-decoration:none; font-size:12px; font-weight:bold; background:rgba(255,255,255,0.1); padding:6px 10px; border-radius:5px;}
    header{background:var(--main);color:#fff;padding:15px;text-align:center;}
    header h1{margin:0;font-size:24px;font-weight:900}
    .container{max-width:100%; margin:0 auto; padding:8px; box-sizing: border-box;}
    .card{background:#fff; padding:12px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); margin-bottom:10px; border:2px solid #000;}
    .input{padding:12px; border:2px solid #000; border-radius:8px; width:100%; font-size:18px; font-weight:900; box-sizing:border-box;}
    .btn{padding:12px; border:none; border-radius:8px; cursor:pointer; font-size:16px; font-weight:900;}
    .btn.main{background:#000;color:#fff}
    .btn.ok{background:var(--ok);color:#fff}
    .btn.danger{background:var(--danger);color:#fff}
    
    /* ضبط الجدول ليكون على مقاس الشاشة تماماً */
    .table-container { width: 100%; overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { border: 2px solid #000; text-align: center; font-weight: 900; word-wrap: break-word; }
    
    .col-id { width: 10%; font-size: 14px; }
    .col-coord { width: 22%; font-size: 15px; padding: 10px 1px; }
    .col-result { width: 23%; font-size: 19px; padding: 10px 2px; background: #f9fafb; }
    th { background: #eee; font-size: 11px; padding: 5px 1px; }
    
    .hidden { display: none !important; }
    .summary-box { display: flex; justify-content: space-between; align-items: center; background: #f0f9ff; padding: 10px; border-radius: 8px; border: 2px solid #000; font-weight: 900; font-size: 16px; }

    .modal { display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.9); overflow-y:auto; }
    .modal-content { background:#fff; margin:2% auto; padding:15px; width:94%; border-radius:10px; border:2px solid #000; }
    #summaryText { background:#fff; color:#000; padding:15px; border:2px solid #000; font-family:monospace; font-size:18px; font-weight:900; white-space:pre-wrap; text-align:left; direction:ltr; line-height:1.4; }
  </style>
</head>
<body>

<nav>
    <a href="p1_survey.html">📐 الرفع</a>
    <a href="p3_db_manager.html">🗄️ النقاط</a>
    <a href="p4_session_manager.html">📂 الجلسات</a>
</nav>

<header><h1>🎯 برنامج 2: التوقيع المساحي</h1><p>م. عمار يوسف</p></header>

<div class="container">
  <div class="card">
    <select id="sessionsDropdown" class="input" style="font-size: 14px; margin-bottom: 8px;"></select>
    <div style="display:flex; gap:8px;">
        <button onclick="startNew()" class="btn main" style="flex:1">➕ جديدة</button>
        <button onclick="saveSess()" class="btn ok" style="flex:1">💾 حفظ</button>
        <button onclick="showSummary()" class="btn" style="flex:1.2; background:#334155; color:#fff">📝 ملخص</button>
    </div>
  </div>
  
  <div class="card">
    <div id="stEdit">
        <input id="stName" class="input" list="ptsList" placeholder="وقوف: ابحث..." style="margin-bottom:5px">
        <div style="display:flex;gap:5px;"><input id="stX" class="input" type="number" placeholder="X"><input id="stY" class="input" type="number" placeholder="Y"></div>
        <button onclick="toggle('st')" class="btn ok" style="width:100%;margin-top:8px;">✅ تثبيت</button>
    </div>
    <div id="stShow" class="summary-box hidden"><div>📍 <span id="txtStN"></span> | X:<span id="txtStX"></span> | Y:<span id="txtStY"></span></div><button onclick="toggle('st')" style="background:#000;color:#fff;border-radius:50%;padding:4px 8px;border:none;">✏️</button></div>
  </div>

  <div class="card">
    <div id="bsEdit">
        <input id="bsName" class="input" list="ptsList" placeholder="زيرو: ابحث..." style="margin-bottom:5px">
        <div style="display:flex;gap:5px;"><input id="bsX" class="input" type="number" placeholder="X"><input id="bsY" class="input" type="number" placeholder="Y"></div>
        <button onclick="toggle('bs')" class="btn ok" style="width:100%;margin-top:8px;">✅ تثبيت</button>
    </div>
    <div id="bsShow" class="summary-box hidden"><div>🎯 <span id="txtBsN"></span> | X:<span id="txtBsX"></span> | Y:<span id="txtBsY"></span></div><button onclick="toggle('bs')" style="background:#000;color:#fff;border-radius:50%;padding:4px 8px;border:none;">✏️</button></div>
  </div>

  <datalist id="ptsList"></datalist>

  <div class="card">
    <div style="display:flex; gap:5px;">
        <div style="flex:2; display:flex; flex-direction:column; gap:5px;">
            <input id="tgX" class="input" type="number" placeholder="X مطلوب" onkeypress="handleKey(event, 'tgY')" inputmode="decimal">
            <input id="tgY" class="input" type="number" placeholder="Y مطلوب" onkeypress="handleKey(event, 'calculate')" inputmode="decimal">
        </div>
        <button onclick="addInv()" class="btn main" style="flex:0.8;font-size:20px">➕<br>حساب</button>
    </div>
  </div>

  <div class="card">
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="col-id">#</th>
                    <th class="col-coord">X</th>
                    <th class="col-coord">Y</th>
                    <th class="col-result">HD</th>
                    <th class="col-result">HR</th>
                </tr>
            </thead>
            <tbody id="resBody"></tbody>
        </table>
    </div>
    <button onclick="updateAll()" class="btn danger" style="width:100%; margin-top:10px;">🔄 تحديث الحسابات (HD/HR)</button>
  </div>
</div>

<div id="summaryModal" class="modal">
    <div class="modal-content">
        <h2 style="text-align:center">📋 ملخص وتصدير التقرير</h2>
        <pre id="summaryText"></pre>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn ok" style="flex:2; background:#000" onclick="downloadTXT()">💾 تصدير .txt للهاتف</button>
            <button class="btn" style="flex:1; background:#ddd; color:#000" onclick="document.getElementById('summaryModal').style.display='none'">إغلاق</button>
        </div>
    </div>
</div>

<script>
    const GRAD = 200 / Math.PI;
    const fixX = (v) => -Math.abs(parseFloat(v || 0));
    let trgs = [], sessId = null, sessInfo = { name: "", note: "" };

    function handleKey(e, targetId) {
        if (e.key === "Enter") {
            if (targetId === 'calculate') addInv();
            else document.getElementById(targetId).focus();
        }
    }

    function inv(sx, sy, bx, by, tx, ty) {
        const bz = (Math.atan2(bx - sx, by - sy) * GRAD + 400) % 400;
        const tz = (Math.atan2(tx - sx, ty - sy) * GRAD + 400) % 400;
        return { d: Math.sqrt(Math.pow(tx - sx, 2) + Math.pow(ty - sy, 2)), r: (tz - bz + 400) % 400 };
    }

    function addInv() {
        const txIn = document.getElementById("tgX"), tyIn = document.getElementById("tgY");
        const tx = fixX(txIn.value), ty = parseFloat(tyIn.value);
        if(isNaN(tx) || isNaN(ty)) return;
        const sx = fixX(document.getElementById("stX").value), sy = parseFloat(document.getElementById("stY").value || 0);
        const bx = fixX(document.getElementById("bsX").value), by = parseFloat(document.getElementById("bsY").value || 0);
        const res = inv(sx, sy, bx, by, tx, ty);
        trgs.push({ x: tx, y: ty, d: res.d, r: res.r });
        render(); txIn.value = ""; tyIn.value = ""; txIn.focus();
    }

    function render() {
        document.getElementById("resBody").innerHTML = trgs.map((t, i) => `
            <tr>
                <td class="col-id">${i+1}</td>
                <td class="col-coord">${t.x.toFixed(2)}</td>
                <td class="col-coord">${t.y.toFixed(2)}</td>
                <td class="col-result" style="color:red;">${t.d.toFixed(2)}</td>
                <td class="col-result">${t.r.toFixed(4)}</td>
            </tr>
        `).join("");
    }

    function showSummary() {
        if (!sessInfo.name) { if (confirm("يجب حفظ الجلسة أولاً لتوليد الملخص. حفظ؟")) { saveSess(); if(!sessInfo.name) return; } else return; }
        let txt = `========================================\n       تقرير توقيع - م. عمار يوسف\n========================================\n`;
        txt += `الاسم    : ${sessInfo.name}\nالوصف   : ${sessInfo.note}\nالتاريخ   : ${new Date().toLocaleDateString('ar-EG')}\n`;
        txt += `الوقوف   : ${document.getElementById("stName").value} (X:${document.getElementById("stX").value}, Y:${document.getElementById("stY").value})\n`;
        txt += `الزيرو    : ${document.getElementById("bsName").value} (X:${document.getElementById("bsX").value}, Y:${document.getElementById("bsY").value})\n`;
        txt += `========================================\n\n`;
        trgs.forEach((t, i) => {
            txt += `Point ${i+1}:\nxc = ${t.x.toFixed(2)}\nyc = ${t.y.toFixed(2)}\nDist = ${t.d.toFixed(2)}\nAngle = ${t.r.toFixed(4)}\n--------------------\n`;
        });
        document.getElementById("summaryText").innerText = txt;
        document.getElementById("summaryModal").style.display = "block";
    }

    function downloadTXT() {
        const blob = new Blob([document.getElementById("summaryText").innerText], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Stakeout_${sessInfo.name}.txt`;
        link.click();
    }

    function updateAll() {
        const sx = fixX(document.getElementById("stX").value), sy = parseFloat(document.getElementById("stY").value || 0);
        const bx = fixX(document.getElementById("bsX").value), by = parseFloat(document.getElementById("bsY").value || 0);
        trgs = trgs.map(t => { const res = inv(sx, sy, bx, by, t.x, t.y); return { ...t, d: res.d, r: res.r }; });
        render(); alert("تم التحديث ✅");
    }

    function startNew() { 
        if(confirm("بدء جلسة جديدة وتفريغ البيانات؟")) { 
            sessId = null; sessInfo = { name: "", note: "" }; trgs = []; render(); 
            document.querySelectorAll('.input').forEach(i => i.value = ""); 
            document.getElementById('stShow').classList.add('hidden'); document.getElementById('stEdit').classList.remove('hidden'); 
            document.getElementById('bsShow').classList.add('hidden'); document.getElementById('bsEdit').classList.remove('hidden'); 
        } 
    }

    function toggle(id) {
        const e = document.getElementById(id + 'Edit'), s = document.getElementById(id + 'Show');
        if(e.classList.contains('hidden')) { e.classList.remove('hidden'); s.classList.add('hidden'); }
        else {
            const n = document.getElementById(id + 'Name').value, x = document.getElementById(id + 'X').value, y = document.getElementById(id + 'Y').value;
            if(!n || !x || !y) return alert("البيانات ناقصة");
            document.getElementById('txt' + id.charAt(0).toUpperCase() + id.slice(1) + 'N').innerText = n;
            document.getElementById('txt' + id.charAt(0).toUpperCase() + id.slice(1) + 'X').innerText = fixX(x).toFixed(2);
            document.getElementById('txt' + id.charAt(0).toUpperCase() + id.slice(1) + 'Y').innerText = parseFloat(y).toFixed(2);
            e.classList.add('hidden'); s.classList.remove('hidden');
        }
    }

    function loadSess() {
        const ss = JSON.parse(localStorage.getItem("sessionsDB_P2") || "[]");
        document.getElementById("sessionsDropdown").innerHTML = '<option value="">--- استرجاع جلسة ---</option>' + ss.reverse().map(s => `<option value="${s.id}">${s.name}</option>`).join("");
    }

    document.getElementById("sessionsDropdown").onchange = function() {
        const s = JSON.parse(localStorage.getItem("sessionsDB_P2") || "[]").find(x => x.id == this.value);
        if(s) {
            sessId = s.id; sessInfo = { name: s.name, note: s.note };
            document.getElementById("stName").value = s.st.n; document.getElementById("stX").value = s.st.x; document.getElementById("stY").value = s.st.y;
            document.getElementById("bsName").value = s.bs.n; document.getElementById("bsX").value = s.bs.x; document.getElementById("bsY").value = s.bs.y;
            trgs = s.data; toggle('st'); toggle('bs'); render();
        }
    };

    window.onload = () => {
        loadSess();
        ["stName", "bsName"].forEach(id => {
            const el = document.getElementById(id);
            el.oninput = (e) => {
                const query = e.target.value.toLowerCase().trim();
                const ptsDl = document.getElementById("ptsList");
                if (query.length < 1) { ptsDl.innerHTML = ""; return; }
                const db = JSON.parse(localStorage.getItem("pointsDB") || "[]");
                const kws = query.split(/\s+/);
                const ms = db.filter(p => kws.every(kw => p.name.toLowerCase().includes(kw)));
                ptsDl.innerHTML = ms.slice(0, 15).map(p => `<option value="${p.name}">`).join("");
            };
            el.onchange = (e) => {
                const p = JSON.parse(localStorage.getItem("pointsDB") || "[]").find(x => x.name === e.target.value);
                if(p) { const pr = id.slice(0,2); document.getElementById(pr + "X").value = Math.abs(p.x); document.getElementById(pr + "Y").value = p.y; }
            };
        });
    };
</script>
</body>
</html>
