<!doctype html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>🎯 P2 التوقيع الذكي - م. عمار يوسف</title>

  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error', err));
      });
    }
  </script>

  <style>
    :root{--main:#6366f1;--danger:#f43f5e;--ok:#10b981;--bg:#ffffff}
    body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:#000;direction:ltr; text-align: left; overflow-x: hidden;}
    nav{background:#1e293b; padding:10px; text-align:center; display:flex; justify-content:center; gap:8px;}
    nav a{color:#fff; text-decoration:none; font-size:12px; font-weight:bold; background:rgba(255,255,255,0.1); padding:6px 10px; border-radius:5px;}
    header{background:var(--main);color:#fff;padding:15px;text-align:center;}
    header h1{margin:0;font-size:24px;font-weight:900}
    .container{padding:8px; box-sizing: border-box; max-width: 980px; margin: 0 auto;}
    .card{background:#fff; padding:12px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); margin-bottom:10px; border:2px solid #000;}
    
    /* تنسيق البحث الديناميكي الصغير والمرتفع للأعلى */
    .input{padding:12px; border:3px solid #000; border-radius:8px; width:100%; font-size:18px; font-weight:900; box-sizing:border-box; background:#fff !important; color:#000 !important;}
    .search-wrap { position: relative; width: 100%; }
    .results-box { 
        position: absolute; 
        bottom: 100%; /* تظهر فوق المربع */
        left: 0; right: 0; 
        background: #fff; border: 3px solid #000; border-bottom: none;
        max-height: 180px; overflow-y: auto; z-index: 9999; display: none;
        border-radius: 8px 8px 0 0; box-shadow: 0 -10px 20px rgba(0,0,0,0.4);
    }
    .result-item { padding: 8px 12px; border-bottom: 1px solid #ddd; cursor: pointer; font-weight: 900; font-size: 14px; color: #000; }
    .result-item:hover { background: #f0f9ff; }

    .btn{padding:12px; border:none; border-radius:8px; cursor:pointer; font-size:16px; font-weight:900;}
    .btn.main{background:#000;color:#fff}
    .btn.ok{background:var(--ok);color:#fff}
    table{width:100%; border-collapse: collapse; table-layout: fixed; margin-top: 10px;}
    th, td { border: 2px solid #000; text-align: center; font-weight: 900; padding: 8px 2px; font-size: 16px;}
    th { background: #eee; font-size: 11px; }
    .hidden { display: none !important; }
    .summary-box { display: flex; justify-content: space-between; align-items: center; background: #f0f9ff; padding: 10px; border: 2px solid #000; font-weight: 900; }
  </style>
</head>
<body>

<nav><a href="index.html">🏠 الرئيسية</a><a href="p1_survey.html">📐 الرفع</a><a href="p3_db_manager.html">🗄️ النقاط</a></nav>
<header><h1>🎯 برنامج 2: التوقيع المساحي</h1><p>م. عمار يوسف</p></header>

<div class="container">
  <!-- الوقوف والزيرو مع البحث المطور -->
  <div class="card">
    <div id="stEdit">
        <div class="search-wrap">
            <input id="stName" class="input" placeholder="نقطة الوقوف..." autocomplete="off">
            <div id="stResults" class="results-box"></div>
        </div>
        <div style="display:flex;gap:5px; margin-top:5px;"><input id="stX" class="input" type="number" placeholder="X"><input id="stY" class="input" type="number" placeholder="Y"></div>
        <button onclick="toggleLock('st')" class="btn ok" style="width:100%;margin-top:8px;">✅ تثبيت</button>
    </div>
    <div id="stShow" class="summary-box hidden"><div>📍 <span id="txtStN"></span> | X:<span id="txtStX"></span></div><button onclick="toggleLock('st')" style="background:#000;color:#fff;border-radius:50%;padding:4px 10px; border:none;">✏️</button></div>
  </div>

  <div class="card">
    <div id="bsEdit">
        <div class="search-wrap">
            <input id="bsName" class="input" placeholder="نقطة الزيرو..." autocomplete="off">
            <div id="bsResults" class="results-box"></div>
        </div>
        <div style="display:flex;gap:5px; margin-top:5px;"><input id="bsX" class="input" type="number" placeholder="X"><input id="bsY" class="input" type="number" placeholder="Y"></div>
        <button onclick="toggleLock('bs')" class="btn ok" style="width:100%;margin-top:8px;">✅ تثبيت</button>
    </div>
    <div id="bsShow" class="summary-box hidden"><div>🎯 <span id="txtBsN"></span> | X:<span id="txtBsX"></span></div><button onclick="toggleLock('bs')" style="background:#000;color:#fff;border-radius:50%;padding:4px 10px; border:none;">✏️</button></div>
  </div>

  <!-- نقطة التوقيع -->
  <div class="card">
    <div class="search-wrap">
        <input id="tgName" class="input" placeholder="بحث ذكي عن نقطة..." autocomplete="off">
        <div id="tgResults" class="results-box"></div>
    </div>
    <div style="display:flex; gap:5px; margin-top:5px;">
        <input id="tgX" class="input" type="number" placeholder="X مطلوب" onkeypress="handleKey(event, 'tgY')" inputmode="decimal">
        <input id="tgY" class="input" type="number" placeholder="Y مطلوب" onkeypress="handleKey(event, 'addInv')" inputmode="decimal">
    </div>
    <button onclick="addInv()" class="btn main" style="width:100%; margin-top:10px;">➕ حساب HD/HR</button>
  </div>

  <div class="card">
    <div style="overflow-x:auto;">
        <table>
            <thead><tr><th>#</th><th>X</th><th>Y</th><th style="color:red">HD</th><th>HR</th></tr></thead>
            <tbody id="resBody"></tbody>
        </table>
    </div>
  </div>
</div>

<script>
    const GRAD = 200 / Math.PI;
    const fixX = (v) => -Math.abs(parseFloat(v || 0));
    let trgs = [];

    function handleKey(e, targetId) {
        if (e.key === "Enter") {
            if (targetId === 'addInv') addInv();
            else document.getElementById(targetId).focus();
        }
    }

    function inv(sx, sy, bx, by, tx, ty) {
        const bz = (Math.atan2(bx - sx, by - sy) * GRAD + 400) % 400;
        const tz = (Math.atan2(tx - sx, ty - sy) * GRAD + 400) % 400;
        return { d: Math.sqrt(Math.pow(tx - sx, 2) + Math.pow(ty - sy, 2)), r: (tz - bz + 400) % 400 };
    }

    function addInv() {
        const txIn = document.getElementById("tgX"), tyIn = document.getElementById("tgY");
        const tx = fixX(txIn.value), ty = parseFloat(tyIn.value);
        if(isNaN(tx) || isNaN(ty)) return;
        const sx = fixX(document.getElementById("stX").value), sy = parseFloat(document.getElementById("stY").value || 0);
        const bx = fixX(document.getElementById("bsX").value), by = parseFloat(document.getElementById("bsY").value || 0);
        const res = inv(sx, sy, bx, by, tx, ty);
        trgs.push({ x: tx, y: ty, d: res.d, r: res.r });
        render(); txIn.value = ""; tyIn.value = ""; document.getElementById("tgName").value = ""; document.getElementById("tgName").focus();
    }

    function render() {
        document.getElementById("resBody").innerHTML = trgs.map((t, i) => `<tr><td>${i+1}</td><td>${t.x.toFixed(2)}</td><td>${t.y.toFixed(2)}</td><td style="color:red;">${t.d.toFixed(2)}</td><td>${t.r.toFixed(4)}</td></tr>`).join("");
    }

    function toggleLock(id) {
        const e = document.getElementById(id + 'Edit'), s = document.getElementById(id + 'Show');
        if(e.classList.contains('hidden')) { e.classList.remove('hidden'); s.classList.add('hidden'); }
        else {
            const n = document.getElementById(id + 'Name').value, x = document.getElementById(id + 'X').value, y = document.getElementById(id + 'Y').value;
            if(!n || !x || !y) return alert("البيانات ناقصة");
            document.getElementById('txt' + id.charAt(0).toUpperCase() + id.slice(1) + 'N').innerText = n;
            document.getElementById('txt' + id.charAt(0).toUpperCase() + id.slice(1) + 'X').innerText = fixX(x).toFixed(2);
            e.classList.add('hidden'); s.classList.remove('hidden');
        }
    }

    // --- محرك البحث الديناميكي والذكي المطور ---
    window.onload = () => {
        const searchConfigs = [
            { id: 'stName', res: 'stResults', other: ['bsName', 'tgName'], pre: 'st' },
            { id: 'bsName', res: 'bsResults', other: ['stName', 'tgName'], pre: 'bs' },
            { id: 'tgName', res: 'tgResults', other: ['stName', 'bsName'], pre: 'tg' }
        ];

        searchConfigs.forEach(conf => {
            const inp = document.getElementById(conf.id);
            const resBox = document.getElementById(conf.res);

            inp.addEventListener('input', () => {
                const queryText = inp.value.toLowerCase().trim();
                const others = conf.other.map(id => document.getElementById(id).value.toLowerCase().trim());
                
                if (!queryText) { resBox.style.display='none'; return; }

                // تقسيم الكلمات للبحث المتعدد (تركيب الكلمات)
                const keywords = queryText.split(/\s+/); 

                const db = JSON.parse(localStorage.getItem("pointsDB") || "[]");
                const matches = db.filter(p => {
                    const n = String(p.name).toLowerCase();
                    // يجب أن يحتوي الاسم على كل الكلمات المكتوبة
                    const isMatch = keywords.every(kw => n.includes(kw));
                    return isMatch && !others.includes(n);
                });

                if (matches.length > 0) {
                    resBox.innerHTML = matches.slice(0, 15).map(p => `
                        <div class="result-item" onclick="pickPt('${conf.id}','${p.name}',${p.x},${p.y},'${conf.res}','${conf.pre}')">
                            ${p.name} <small style="color:gray; font-size:10px;">(${p.area || ''})</small>
                        </div>
                    `).join("");
                    resBox.style.display = 'block';
                } else { resBox.style.display = 'none'; }
            });
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrap')) {
                document.querySelectorAll('.results-box').forEach(b => b.style.display='none');
            }
        });
    };

    function pickPt(inpId, name, x, y, resId, pre) {
        document.getElementById(inpId).value = name;
        document.getElementById(pre + 'X').value = Math.abs(x);
        document.getElementById(pre + 'Y').value = y;
        document.getElementById(resId).style.display = 'none';
        if (pre === 'tg') document.getElementById('tgY').focus();
    }
</script>
</body>
</html>
